<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algo especial para ti 💌</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="contenedor">
    <h1>Algo especial para ti ♡</h1>
    <p class="instruccion">Toca el corazón para abrirla</p>

    <div class="escena">
      <div class="sobre" id="sobre">
        <div class="parte-trasera"></div>

        <div class="carta">
          <div class="contenido-carta">
            <span class="flor">🌸</span>
            <h2>A Little Letter</h2>
            <p>Para alguien muy especial ♡</p>
          </div>
        </div>

        <div class="solapa"></div>
        <div class="parte-delantera"></div>

        <button
          class="sello"
          id="abrirCarta"
          aria-label="Abrir carta"
        >♥</button>
      </div>
    </div>
    

<!-- Transición natural de flores -->
<div class="transicion-flores" id="transicionFlores">
  <img src="assets/flor_rosa.png" class="flor-vuelo" alt="">
  <img src="assets/flor_azul.png" class="flor-vuelo" alt="">
  <img src="assets/flor_blanca.png" class="flor-vuelo" alt="">
  <img src="assets/flor_lila.png" class="flor-vuelo" alt="">
  <img src="assets/flor_amarilla.png" class="flor-vuelo" alt="">
  <img src="assets/flor_cerezo.png" class="flor-vuelo" alt="">
</div>


<!-- Carta antigua -->
<section class="pantalla-carta" id="pantallaCarta">
  <div class="papel-antiguo">
    <h2>A Little Letter ♡</h2>
    <p>Para alguien muy especial...</p>
    <img src="assets/flores.png" alt="" class="decoracion-floral">
  </div>
</section>
  </main>

</body>
</html>

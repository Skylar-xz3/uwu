
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Una cartita para ti 💌</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

  <main class="contenedor">
    <h1>Una cartita para ti ♡</h1>
    <p class="instruccion">Toca el corazón para abrirla</p>

    <div class="escena">
      <div class="sobre" id="sobre">
        <div class="parte-trasera"></div>

        <div class="carta">
          <div class="contenido-carta">
            <span class="flor">🌸</span>
            <h2>A Little Letter</h2>
            <p>Para alguien muy especial ♡</p>
          </div>
        </div>

        <div class="solapa"></div>
        <div class="parte-delantera"></div>

        <button
          class="sello"
          id="abrirCarta"
          aria-label="Abrir carta"
        >♥</button>
      </div>
    </div>
  </main>

</body>
</html>
